name: Bing Daily Check-in

on:
  schedule:
    # UTC 凌晨2点执行（对应北京时间上午10点）
    # 如需北京时间凌晨2点执行，请改为 cron: '0 18 * * *'
    - cron: '0 2 * * *'
  workflow_dispatch:  # 允许手动触发
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  bing-checkin:
    # 固定使用 24.04，避免 ubuntu-latest 迁移到 Ubuntu 26 后环境变化
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: 1  # 确保Python输出不被缓存
      ACCOUNTS_CONFIG: ${{ secrets.ACCOUNTS_CONFIG }}  # 通过环境变量传递Secret，避免引号注入问题

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install Chrome
      run: |
        # 直接下载官方 .deb 安装包，避免 apt 源/gpg 密钥步骤失败导致整个任务中断
        wget -q -O /tmp/google-chrome-stable.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
        sudo apt-get install -y /tmp/google-chrome-stable.deb
        google-chrome --version

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Setup accounts configuration
      run: |
        mkdir -p config
        if [ -z "$ACCOUNTS_CONFIG" ]; then
          echo "::error::Secret ACCOUNTS_CONFIG 未配置！请到仓库 Settings -> Secrets and variables -> Actions 添加账号JSON配置"
          exit 1
        fi
        printf '%s' "$ACCOUNTS_CONFIG" > config/accounts.json
        # 提前校验JSON合法性，避免跑到一半才失败
        python -c "import json; json.load(open('config/accounts.json', encoding='utf-8'))" \
          || { echo "::error::ACCOUNTS_CONFIG 不是合法的JSON格式"; exit 1; }
        echo "账号配置校验通过"

    - name: Run Bing automation
      run: |
        python bingZDH.py --once

    - name: Collect logs and screenshots
      if: always()
      run: |
        # 汇总日志和失败截图到统一目录，保证产物一定能上传
        mkdir -p artifacts
        cp -f bing_automation.log artifacts/ 2>/dev/null || true
        cp -f /tmp/bing_automation.log artifacts/ 2>/dev/null || true
        cp -f *.png artifacts/ 2>/dev/null || true
        ls -la artifacts/ || true

    - name: Upload logs
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: bing-logs
        path: artifacts/
        if-no-files-found: ignore
        retention-days: 7
